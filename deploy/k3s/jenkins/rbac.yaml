apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: anime-companion
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: anime-companion
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: anime-companion
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["anime-companion-app", "anime-companion-jobs", "anime-companion-backup"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["anime-companion-config", "anime-companion-release"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["postgres", "redis", "agent", "gateway"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent", "gateway"]
    verbs: ["get", "patch", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["postgres", "redis"]
    verbs: ["get", "patch", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames:
      - default-deny
      - allow-cluster-dns
      - allow-postgres-callers
      - allow-redis-callers
      - allow-agent-from-gateway
      - allow-gateway-from-traefik
      - allow-gateway-egress
      - allow-agent-egress
      - allow-jobs-egress
      - allow-backup-egress
      - allow-acme-solver-from-traefik
    verbs: ["get", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["anime-companion-http", "anime-companion-https"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["database-migrate", "seed-admin"]
    verbs: ["get", "delete", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["postgres-backup"]
    verbs: ["get", "patch"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    resourceNames: ["redirect-https"]
    verbs: ["get", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    resourceNames: ["animecompanion-icu-production-tls"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: anime-companion
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: anime-companion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: anime-companion-jenkins-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    resourceNames: ["local-path"]
    verbs: ["get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - clusterissuers.cert-manager.io
      - middlewares.traefik.io
    verbs: ["get"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: ["letsencrypt-production"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anime-companion-jenkins-cluster-read
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: anime-companion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: anime-companion-jenkins-cluster-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anime-companion-jenkins-preflight
  namespace: kube-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["traefik"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["traefik"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anime-companion-jenkins-preflight
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: anime-companion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anime-companion-jenkins-preflight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anime-companion-jenkins-preflight
  namespace: cert-manager
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cert-manager"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anime-companion-jenkins-preflight
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: anime-companion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anime-companion-jenkins-preflight
