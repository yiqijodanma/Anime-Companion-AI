apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate
  namespace: anime-companion
  labels:
    app.kubernetes.io/name: database-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: anime-companion
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: anime-companion
    spec:
      serviceAccountName: anime-companion-jobs
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: anime-companion-migrate:release-placeholder
          imagePullPolicy: IfNotPresent
          args:
            - -path=/migrations
            - -database=$(PG_DSN)
            - up
          env:
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: anime-companion-secrets
                  key: PG_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
