apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: anime-companion
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: anime-companion
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: anime-companion
        spec:
          serviceAccountName: anime-companion-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: anime-companion-backup:release-placeholder
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  valueFrom:
                    configMapKeyRef:
                      name: anime-companion-config
                      key: TZ
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: anime-companion-config
                      key: PGHOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: anime-companion-config
                      key: PGPORT
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: anime-companion-config
                      key: PGDATABASE
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: anime-companion-config
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: anime-companion-secrets
                      key: POSTGRES_PASSWORD
                - name: OSS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_ACCESS_KEY_ID
                - name: OSS_ACCESS_KEY_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_ACCESS_KEY_SECRET
                - name: OSS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_SESSION_TOKEN
                      optional: true
                - name: OSS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_BUCKET
                - name: OSS_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_ENDPOINT
                - name: OSS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_REGION
                - name: OSS_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: oss-backup-secrets
                      key: OSS_PREFIX
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 200m
                  memory: 128Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 20Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 20Gi
