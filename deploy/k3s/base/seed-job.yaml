apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin
  namespace: anime-companion
  labels:
    app.kubernetes.io/name: seed-admin
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: anime-companion
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-admin
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: anime-companion
    spec:
      serviceAccountName: anime-companion-jobs
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: anime-companion-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: anime-companion-config
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: seed-admin
          image: anime-companion-gateway:release-placeholder
          imagePullPolicy: IfNotPresent
          command: ["/app/seed-admin"]
          env:
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: anime-companion-secrets
                  key: PG_DSN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: anime-companion-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anime-companion-secrets
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
