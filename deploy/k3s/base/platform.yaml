apiVersion: v1
kind: ServiceAccount
metadata:
  name: anime-companion-app
  namespace: anime-companion
automountServiceAccountToken: false
imagePullSecrets:
  - name: acr-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anime-companion-jobs
  namespace: anime-companion
automountServiceAccountToken: false
imagePullSecrets:
  - name: acr-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anime-companion-backup
  namespace: anime-companion
automountServiceAccountToken: false
imagePullSecrets:
  - name: acr-pull
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anime-companion-config
  namespace: anime-companion
data:
  TZ: Asia/Shanghai
  POSTGRES_DB: companion
  POSTGRES_USER: companion
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: companion
  PGUSER: companion
  REDIS_ADDR: redis:6379
  AGENT_GRPC_ADDR: agent:9090
  GATEWAY_HTTP_ADDR: :8080
  DEEPSEEK_MODEL: deepseek-v4-flash
  SMTP_HOST: smtpdm.aliyun.com
  SMTP_PORT: "465"
  SMTP_IMPLICIT_TLS: "true"
  SMTP_FROM: smtp-from-placeholder@animecompanion.invalid
  COOKIE_SECURE: "true"
  WECHAT_ENABLED: "false"
  DAILY_QUOTA_LIMIT: "20"
  QUOTA_TIME_ZONE: Asia/Shanghai
  PUBLIC_ORIGIN: https://animecompanion.icu
